<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Manifiesto Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap">
<style id="m-style">
/* Layout: una sola columna editorial sobre fondo nocturno; tres actos (Fundamentos · Metas · Plan) */
:root{
  --bg:#07080a; --bg-2:#0d0e11;
  --fg:#f3f2ef; --muted:#9b9ca3; --faint:#5f6068;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.16);
  --surface:rgba(255,255,255,.025); --surface-2:rgba(255,255,255,.05);
  --display:"Fraunces","Times New Roman",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ink:255,255,255; --paper:7,8,10; --shadow:rgba(0,0,0,.55); --star:255,255,255;
  color-scheme:dark;
}
/* Modo blanco: misma estructura, tinta negra sobre papel */
:root[data-mode="light"]{
  --bg:#fbfbf9; --bg-2:#ffffff;
  --fg:#0b0b0d; --muted:#5c5d63; --faint:#9c9da3;
  --ink:12,12,14; --paper:251,251,249; --shadow:rgba(20,20,24,.14); --star:12,12,14;
  --line:rgba(12,12,14,.1); --line-2:rgba(12,12,14,.2);
  --surface:rgba(12,12,14,.022); --surface-2:rgba(12,12,14,.05);
  color-scheme:light;
}
:root[data-mode="light"] .grain{opacity:.035;mix-blend-mode:multiply}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 45% at 50% -8%,rgba(var(--ink),.09),transparent 70%),
   radial-gradient(40% 35% at 85% 35%,rgba(var(--ink),.035),transparent 70%),
   radial-gradient(45% 40% at 10% 75%,rgba(var(--ink),.03),transparent 70%)}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
::selection{background:var(--fg);color:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px;border-radius:6px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:linear-gradient(to bottom,rgba(var(--paper),.85),rgba(var(--paper),.55));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mono-badge{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;
  font-family:var(--display);font-style:italic;font-size:15px;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.nav a{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:999px;transition:color .2s,background .2s}
.nav a:hover{color:var(--fg);background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:8px 16px;
  font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--surface-2)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid:hover{opacity:.88}
.icon-btn{width:36px;height:36px;padding:0;justify-content:center;flex:none}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.4}
.actions{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:460px){.btn-dl-txt{display:none}}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
@media (max-width:760px){.nav{display:none}.brand-txt span{display:none}}

/* ---------- Hero ---------- */
.hero{padding-block:96px 72px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:7px 16px;
  font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--fg);box-shadow:0 0 12px rgba(var(--ink),.8)}
.eyebrow .sep{color:var(--faint)}
h1{font-family:var(--display);font-weight:300;font-size:clamp(40px,7.2vw,88px);line-height:1.02;letter-spacing:-.025em;margin:28px auto 0;max-width:15ch;text-wrap:balance;font-variation-settings:"opsz" 144}
h1 em,h2 em{font-style:italic;font-weight:300;color:var(--fg)}
h1 .soft{color:var(--muted)}
.hero p.lede{max-width:56ch;margin:26px auto 0;color:var(--muted);font-size:16px}
.signer{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:6px}
.signer .name{font-family:var(--display);font-style:italic;font-size:22px}
.signer .role{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.glance{margin:40px auto 0;display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.glance .lbl{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px}
.chip{font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.chip b{color:var(--fg);font-weight:500}
@media (max-width:600px){.glance{border-radius:18px}.hero{padding-block:64px 48px}}

/* ---------- Sections ---------- */
section.act{padding-block:72px;border-top:1px solid var(--line);scroll-margin-top:70px}
.act-head{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;margin-bottom:48px}
.act-num{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding-top:14px}
.act-num b{color:var(--fg);font-weight:500}
h2{font-family:var(--display);font-weight:300;font-size:clamp(32px,4.6vw,56px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance;font-variation-settings:"opsz" 144}
.act-sub{color:var(--muted);max-width:58ch;margin:14px 0 0}
@media (max-width:760px){.act-head{grid-template-columns:1fr;gap:6px}.act-num{padding-top:0}section.act{padding-block:56px}}

.label{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

/* Propósito y visión */
.statements{display:grid;gap:0;border-top:1px solid var(--line)}
.statement{display:grid;grid-template-columns:200px 1fr;gap:24px;padding-block:36px;border-bottom:1px solid var(--line)}
.statement .k{display:flex;flex-direction:column;gap:6px}
.statement .k b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:-.01em}
.statement .v{font-family:var(--display);font-weight:300;font-size:clamp(22px,2.6vw,32px);line-height:1.3;letter-spacing:-.012em;color:var(--muted);text-wrap:pretty;max-width:34ch;min-width:0}
.statement .v strong{font-weight:400;font-style:italic;color:var(--fg)}
@media (max-width:760px){.statement{grid-template-columns:1fr;gap:12px;padding-block:28px}}

/* Principios */
.principles-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:72px 0 22px;flex-wrap:wrap}
.principles-head h3{font-family:var(--display);font-weight:300;font-size:clamp(26px,3vw,36px);margin:0;letter-spacing:-.015em}
.principles-head h3 em{font-style:italic}
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.pr{position:relative;padding:28px 26px 30px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;transition:background .3s}
.pr:hover{background:var(--surface)}
.pr .n{font-family:var(--display);font-style:italic;font-weight:300;font-size:40px;line-height:1;color:var(--faint);font-variant-numeric:lining-nums}
.pr h4{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:-.01em;margin:18px 0 8px;line-height:1.2}
.pr p{margin:0;color:var(--muted);font-size:14.5px}
.pr .tools{position:absolute;top:16px;right:14px;display:flex;gap:2px}
@media (max-width:900px){.principles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.principles{grid-template-columns:1fr}}

/* Metas */
.summary{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:28px;overflow:hidden}
.summary > div{padding:22px 26px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.summary > div:first-child{border-left:0}
.ring-wrap{flex-direction:row!important;align-items:center;gap:18px!important}
.ring{width:76px;height:76px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .track{stroke:var(--line-2)}
.ring .val{stroke:var(--fg);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)}
.big{font-family:var(--display);font-weight:300;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--faint)}
.small-v{font-size:14px;color:var(--muted)}
@media (max-width:860px){.summary{grid-template-columns:1fr 1fr}.summary > div:nth-child(3){border-left:0}.summary > div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:460px){.summary{grid-template-columns:1fr}.summary > div{border-left:0!important}.summary > div:nth-child(n+2){border-top:1px solid var(--line)}}

.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.goals{grid-template-columns:1fr}}
.goal{position:relative;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(var(--ink),.035),rgba(var(--ink),.012));padding:26px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden}
.goal::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--ink),.35),transparent);opacity:.6}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.goal-idx{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:5px 11px 5px 9px;font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;white-space:nowrap}
.status .ico{width:10px;height:10px;border-radius:50%;border:1px solid currentColor;position:relative;overflow:hidden}
.status[data-s="progress"]{color:var(--fg)}
.status[data-s="progress"] .ico::after{content:"";position:absolute;inset:0 50% 0 0;background:currentColor}
.status[data-s="done"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.status[data-s="done"] .ico{background:currentColor}
button.status:hover{border-color:var(--fg)}
.goal h3{font-family:var(--display);font-weight:300;font-size:28px;line-height:1.12;letter-spacing:-.018em;margin:0;text-wrap:balance}
.area{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.meta-rows{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.meta-rows > div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.meta-rows > div:nth-child(odd){padding-right:12px}
.meta-rows > div:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.meta-rows .v{font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta-rows .v.late{font-style:italic;font-family:var(--display);font-size:15px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline}
.prog-row .pct{font-family:var(--display);font-size:22px;font-weight:300;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.qa{display:flex;flex-direction:column;gap:6px}
.qa p{margin:0;color:var(--muted);font-size:14.5px}
.goal-empty{align-items:flex-start;justify-content:center;min-height:420px;border-style:dashed;background:transparent}
.goal-empty .ph{font-family:var(--display);font-style:italic;font-weight:300;font-size:30px;color:var(--faint);line-height:1.15}
.goal-empty p{color:var(--faint);margin:0;max-width:30ch;font-size:14px}

/* Plan */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 16px 9px 12px;color:var(--muted);max-width:100%;min-width:0;transition:all .2s}
.tab .tn{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.09em;color:var(--faint)}
.tab .tt{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.tab:hover{color:var(--fg);border-color:var(--line-2)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-selected="true"] .tn{color:rgba(var(--paper),.55)}
.plan{border:1px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}
.plan-head{padding:30px 32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--line)}
.plan-head h3{font-family:var(--display);font-weight:300;font-size:clamp(26px,3vw,38px);margin:8px 0 0;line-height:1.1;letter-spacing:-.018em;text-wrap:balance}
.plan-head .pct{font-family:var(--display);font-weight:300;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums;text-align:right}
.plan-head .pct small{display:block;font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin-top:10px}
.next{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;background:rgba(var(--ink),.02)}
.next .t{font-family:var(--display);font-style:italic;font-weight:300;font-size:22px;letter-spacing:-.01em;min-width:0;flex:1}
.plan-body{display:grid;grid-template-columns:1.35fr 1fr}
.plan-col{padding:28px 32px;min-width:0}
.plan-col + .plan-col{border-left:1px solid var(--line)}
.plan-col h4{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.plan-col .hint{color:var(--faint);font-size:13px;margin:0 0 18px}
@media (max-width:860px){.plan-body{grid-template-columns:1fr}.plan-col + .plan-col{border-left:0;border-top:1px solid var(--line)}.plan-head{grid-template-columns:1fr}.plan-head .pct{text-align:left}.plan-head,.plan-col,.next{padding-inline:22px}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1px solid var(--line-2);border-radius:6px;margin:1px 0 0;display:grid;place-items:center;cursor:pointer;transition:all .2s;background:transparent}
.check:hover{border-color:var(--fg)}
.check:checked{background:var(--fg);border-color:var(--fg)}
.check:checked::after{content:"";width:9px;height:5px;border-left:1.5px solid var(--bg);border-bottom:1.5px solid var(--bg);transform:translateY(-1px) rotate(-45deg)}
.step .txt{min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.step.done .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.step .when{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px;font-variant-numeric:tabular-nums}
.habits{display:flex;flex-direction:column}
.habit{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .txt{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.freq{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.empty-line{color:var(--faint);font-style:italic;font-family:var(--display);font-size:17px;padding:10px 0}
.plan-empty{padding:56px 32px;text-align:center;color:var(--faint)}
.plan-empty .ph{font-family:var(--display);font-style:italic;font-size:28px;color:var(--muted);margin-bottom:8px}

/* ---------- Edit mode ---------- */
.ed{width:100%;background:rgba(var(--ink),.035);border:1px dashed var(--line-2);border-radius:10px;color:var(--fg);font:inherit;padding:8px 10px;resize:none;transition:border-color .2s,background .2s;letter-spacing:inherit;line-height:inherit;min-width:0}
.ed:focus{outline:none;border-style:solid;border-color:var(--fg);background:rgba(var(--ink),.06)}
.ed::placeholder{color:var(--faint);font-style:italic}
textarea.ed{display:block;overflow:hidden}
select.ed{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.ed option{background:var(--bg-2);color:var(--fg)}
input[type=date].ed{color-scheme:inherit}
.ed-display{font-family:var(--display);font-weight:300}
.mini{width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--faint);display:grid;place-items:center;font-size:14px;line-height:1;flex:none}
.mini:hover{color:var(--fg);border-color:var(--line-2);background:var(--surface-2)}
.add{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px dashed var(--line-2);border-radius:999px;background:transparent;padding:8px 14px;color:var(--muted);font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.add:hover{color:var(--fg);border-color:var(--fg)}
.fmt-hint{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--faint);margin-top:8px}
.edit-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

/* ---------- Save bar ---------- */
.savebar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);z-index:30;
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;border:1px solid var(--line-2);border-radius:999px;background:rgba(13,14,17,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 18px 50px var(--shadow);max-width:calc(100% - 32px);transition:opacity .25s,transform .25s}

.savebar .msg i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg);margin-right:10px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}

footer{border-top:1px solid var(--line);padding-block:56px 120px;text-align:center}

.reveal{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}

<script id="m-app">
(function(){

var LS_KEY="manifiesto-local-v1", TAB_KEY="manifiesto-tab";

function clone(o){return JSON.parse(JSON.stringify(o))}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

var ui={edit:false,tab:+(ls(TAB_KEY)||0)||0,saving:false,msg:"",readonly:false,mode:ls("manifiesto-mode")==="light"?"light":"dark"};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")}
function getP(path){return path.split(".").reduce(function(o,k){return o==null?o:o[k]},state)}
function setP(path,val){var ks=path.split("."),o=state;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function dirty(){return JSON.stringify(state)!==JSON.stringify(saved)}
var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(iso){if(!iso)return"—";var p=iso.split("-");return +p[2]+" "+MES[+p[1]-1]+" "+p[0]}
function today0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function daysLeft(g){if(!g.deadline||g.status==="done")return null;var p=g.deadline.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((d-today0())/864e5)}

function pctTxt(p){return Math.round(p*100)+"%"}

  var P=all.t?all.d/all.t:0,C=2*Math.PI*34;

      '<div class="label" style="margin-top:4px">Los pasos y hábitos se editan en el Plan ↓</div></div></article>';
  }
  if(isEmpty(g))return '<article class="goal goal-empty"><span class="goal-idx">Meta 0'+(i+1)+'</span><div class="ph">Espacio libre para tu próxima meta</div><p>Solo tres. Elige la que más mueva tu vida hoy.</p><button class="btn" data-act="define" data-i="'+i+'" type="button">Definir meta</button></article>';
  var p=prog(g),dl=daysLeft(g);
  return '<article class="goal"><div class="goal-top"><span class="goal-idx">Meta 0'+(i+1)+'</span><button class="status" data-s="'+g.status+'" data-act="cycle" data-i="'+i+'" type="button" title="Cambiar estado"><span class="ico"></span>'+STATUS[g.status]+'</button></div>'+
    '<div><h3>'+esc(g.title||"Meta sin título")+'</h3>'+(g.area?'<div class="area">'+esc(g.area)+'</div>':'')+'</div>'+
    '<div class="meta-rows"><div><span class="label">Recompensa</span><span class="v">'+esc(g.reward||"—")+'</span></div><div><span class="label">Fecha límite</span><span class="v">'+fmtDate(g.deadline)+'</span></div>'+
    '<div><span class="label">Días restantes</span><span class="v'+(dl!==null&&dl<0?" late":"")+'">'+daysTxt(g)+'</span></div><div><span class="label">Pasos</span><span class="v">'+p.d+' / '+p.t+'</span></div></div>'+
    '<div class="prog"><div class="prog-row"><span class="label">Progreso</span><span class="pct">'+pctTxt(p.p)+'</span></div><div class="bar"><span style="width:'+(p.p*100)+'%"></span></div></div>'+
    (g.why?'<div class="qa"><span class="label">Por qué importa</span><p>'+esc(g.why)+'</p></div>':'')+
    (g.measure?'<div class="qa"><span class="label">Cómo mido el éxito</span><p>'+esc(g.measure)+'</p></div>':'')+
    '<a class="btn ghost" href="#plan" data-act="tab" data-i="'+i+'" style="align-self:flex-start;padding-left:0;margin-top:auto">Ver plan →</a></article>';
}

function sizeAll(){document.querySelectorAll("textarea.ed").forEach(size)}
function size(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
function updateBar(){
  var bar=document.getElementById("savebar");if(!bar)return;var d=dirty();
  if(!d&&!ui.msg){bar.hidden=true;return}
  bar.hidden=false;
  bar.innerHTML='<span class="msg">'+(ui.saving?'<i></i>Guardando…':esc(ui.msg||"Cambios sin guardar"))+'</span>'+(d&&!ui.saving&&!ui.readonly?'<button class="btn ghost" data-act="discard" type="button">Descartar</button><button class="btn solid" data-act="save" type="button">Guardar</button>':'');
}
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y)}

/* ---------- events ---------- */
var app=document.getElementById("app");
app.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.path||t.type==="checkbox")return;
  setP(t.dataset.path,t.value);if(t.tagName==="TEXTAREA")size(t);
  if(ui.msg&&!ui.saving)ui.msg="";
  if(!t.dataset.rerender)updateBar();
});
app.addEventListener("change",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.path)return;
  if(t.type==="checkbox"){setP(t.dataset.path,t.checked);ui.msg="";keepScroll(render);return}
  setP(t.dataset.path,t.value);ui.msg="";
  if(t.dataset.rerender)keepScroll(render);else updateBar();
});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,i=+b.dataset.i,g=state.goals[ui.tab];
  if(a==="tab"){ui.tab=i;ls(TAB_KEY,String(i));if(b.tagName==="A"){render();return}keepScroll(render);return}
  if(a==="define"){ui.edit=true;ui.tab=i;render();var f=document.getElementById("f-goals-"+i+"-title");if(f){f.scrollIntoView({block:"center"});f.focus()}return}
  if(a==="save"){save();return}
  if(a==="mode"){ui.mode=ui.mode==="light"?"dark":"light";ls("manifiesto-mode",ui.mode);applyMode();keepScroll(render);return}
  if(a==="download"){download();return}
  if(a==="discard"){state=clone(saved);ui.msg="";keepScroll(render);return}
  if(a==="cycle"){var g2=state.goals[i];g2.status={todo:"progress",progress:"done",done:"todo"}[g2.status];keepScroll(render);return}
  if(a==="pr-add"){state.principles.push({t:"",d:""});keepScroll(render);var n=state.principles.length-1;var f2=document.getElementById("f-principles-"+n+"-t");if(f2)f2.focus();return}
  if(a==="pr-del"){state.principles.splice(i,1);keepScroll(render);return}
  if(a==="pr-up"){var x=state.principles.splice(i,1)[0];state.principles.splice(i-1,0,x);keepScroll(render);return}
  if(a==="step-add"){g.steps.push({t:"",d:"",done:false});keepScroll(render);var f3=document.getElementById("f-goals-"+ui.tab+"-steps-"+(g.steps.length-1)+"-t");if(f3)f3.focus();return}
  if(a==="step-del"){g.steps.splice(i,1);keepScroll(render);return}
  if(a==="hab-add"){g.habits.push({t:"",f:"Diario"});keepScroll(render);var f4=document.getElementById("f-goals-"+ui.tab+"-habits-"+(g.habits.length-1)+"-t");if(f4)f4.focus();return}
  if(a==="hab-del"){g.habits.splice(i,1);keepScroll(render);return}
  if(a==="goal-clear"){state.goals[i]={title:"",area:"",reward:"",deadline:"",status:"todo",why:"",measure:"",steps:[],habits:[]};keepScroll(render);return}
});
app.addEventListener("click",function(e){if(e.target.id==="toggle-edit"||e.target.closest("#toggle-edit")){ui.edit=!ui.edit;keepScroll(render)}});
window.addEventListener("keydown",function(e){if((e.metaKey||e.ctrlKey)&&e.key==="s"){e.preventDefault();if(dirty())save()}});

/* ---------- persistence ---------- */
var artifactP=null;
function getArtifact(){if(!artifactP){artifactP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use("artifact")).catch(function(){return null}):Promise.resolve(null)}return artifactP}
function cleaned(){
  var s=clone(state);
  s.principles=s.principles.filter(function(p){return p.t.trim()||p.d.trim()});
  s.goals.forEach(function(g){g.steps=g.steps.filter(function(x){return x.t.trim()});g.habits=g.habits.filter(function(x){return x.t.trim()})});
  s.savedAt=Date.now();return s;
}
function buildDoc(s){
  var resetEl=document.head&&document.head.querySelector("style");
  var reset=resetEl?resetEl.textContent:":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  var css=document.getElementById("m-style").outerHTML;
  var js=document.getElementById("m-app").textContent;
  var SC="script";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>Manifiesto Personal</title>\n'+FONTS+'\n'+css+'\n<canvas id="sky" aria-hidden="true"></canvas>\n<div class="glow" aria-hidden="true"></div>\n<div class="grain" aria-hidden="true"></div>\n<div id="app"></div>\n'+
    '<'+SC+' type="application/json" id="m-data">'+json+'</'+SC+'>\n<'+SC+' id="m-app">'+js+'</'+SC+'>\n</body></html>';
}
function save(){
  if(ui.saving)return;var s=cleaned();ui.saving=true;updateBar();
  getArtifact().then(function(art){
    if(!art){ls(LS_KEY,JSON.stringify(s));state=s;saved=clone(s);ui.saving=false;ui.msg="Guardado en este navegador";keepScroll(render);flashOff();return}
    try{sessionStorage.setItem(LS_KEY,JSON.stringify(s))}catch(e){}
    return art.publish(buildDoc(s)).then(function(){ls(LS_KEY,null);ui.saving=false;ui.msg="Guardado";updateBar()},function(err){
      ui.saving=false;var c=err&&err.code;
      if(c==="conflict"){ui.msg="Hay una versión más nueva. Recargando…"}
      else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){ls(LS_KEY,JSON.stringify(s));state=s;saved=clone(s);ui.msg="Solo lectura aquí. Guardado en este navegador";ui.readonly=true;keepScroll(render);return}
      else if(c==="rate_limited"){ui.msg="Demasiados guardados seguidos. Espera unos segundos"}
      else ui.msg="No se pudo guardar. Intenta de nuevo";
      updateBar();
    });
  });
}
function download(){
  var html=buildDoc(cleaned());
  var p=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use("downloads")).catch(function(){return null}):Promise.resolve(null);
  p.then(function(dl){
    if(dl)return dl.save({filename:"manifiesto-personal.html",data:html}).then(null,function(err){
      var c=err&&err.code;if(c==="declined")return;
      ui.msg=c==="rate_limited"?"Ya hay una descarga abierta":"La descarga no está disponible aquí";updateBar();flashOff();
    });
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="manifiesto-personal.html";document.body.appendChild(a);a.click();a.remove()}
    catch(e){ui.msg="La descarga no está disponible aquí";updateBar();flashOff()}
  });
}
function flashOff(){setTimeout(function(){if(!dirty()){ui.msg="";updateBar()}},2600)}

/* recover a stash from a publish interrupted before reload */
try{var st=JSON.parse(sessionStorage.getItem(LS_KEY)||"null");sessionStorage.removeItem(LS_KEY);if(st&&st.savedAt>(embedded.savedAt||0)+1000&&JSON.stringify(st)!==JSON.stringify(state)){state=st}}catch(e){}

render();
if(localNote){ui.msg="Mostrando la versión guardada en este navegador";updateBar();flashOff()}

/* ---------- night sky ---------- */
(function(){
  var c=document.getElementById("sky");if(!c||!c.getContext)return;var x=c.getContext("2d"),stars=[],W,H,dpr;
  var still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function seed(){dpr=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(W*H/9000);stars=[];for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*.9+.2,a:Math.random()*.55+.08,s:Math.random()*.0015+.0004,p:Math.random()*6.28})}
  var col="255,255,255",k=1;
  function readCol(){col=(getComputedStyle(document.documentElement).getPropertyValue("--star")||"255,255,255").trim();k=document.documentElement.getAttribute("data-mode")==="light"?.45:1}
  window.__skyRedraw=function(){readCol();if(still)draw(0)};readCol();
  function draw(t){x.clearRect(0,0,W,H);for(var i=0;i<stars.length;i++){var s=stars[i];var a=k*(still?s.a:s.a*(.6+.4*Math.sin(t*s.s+s.p)));x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fillStyle="rgba("+col+","+a.toFixed(3)+")";x.fill()}}
  function loop(t){draw(t);if(!still)requestAnimationFrame(loop)}
  seed();requestAnimationFrame(loop);
  var to;window.addEventListener("resize",function(){clearTimeout(to);to=setTimeout(function(){seed();if(still)draw(0)},150)});
})();
})();
</script>
</body></html>
